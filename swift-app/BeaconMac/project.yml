name: BeaconMac
options:
  bundleIdPrefix: com.beaconmac
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
    COMBINE_HIDPI_IMAGES: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BeaconMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Beacon
        excludes:
          - Resources/Info.plist
          - Resources/Beacon.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beaconmac.app
        PRODUCT_NAME: BeaconMac
        INFOPLIST_FILE: Sources/Beacon/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Beacon/Resources/Beacon.entitlements
        CODE_SIGN_STYLE: Automatic
        LSApplicationCategoryType: public.app-category.developer-tools
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: Sources/Beacon/Resources/Beacon.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: Sources/Beacon/Resources/Info.plist
      properties:
        CFBundleDisplayName: BeaconMac
        CFBundleName: BeaconMac
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - sdk: AppKit.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
schemes:
  BeaconMac:
    build:
      targets:
        BeaconMac: all
    run:
      config: Debug
    archive:
      config: Release
