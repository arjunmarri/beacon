appId: com.beacon.mac.monitor
productName: Beacon
asar: false
directories:
  output: release
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - scripts/sample-vite-worker.mjs
  - package.json
  - "!node_modules/**/*"
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
dmg:
  title: Beacon Installer
  window:
    width: 540
    height: 360
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications
